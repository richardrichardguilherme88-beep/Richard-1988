<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pesquisa + Erro 404 + Play 💙</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #642222;
            font-family: "Courier New", monospace;
            padding: 20px;
        }
        .tela {
            background: #003300;
            border: 8px solid #8B4513;
            max-width: 580px;
            margin: 0 auto;
            padding: 25px;
            color: #0f0;
            min-height: 500px;
        }
        h1 {
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 1px solid #0f0;
            padding-bottom: 10px;
        }
        .barra {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input {
            flex: 1;
            background: #073467;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 12px;
            font-size: 15px;
            font-family: "Courier New", monospace;
            outline: none;
        }
        button {
            background: #2F0458;
            border: 2px outset #0f0;
            color: #0f0;
            padding: 12px 20px;
            font-family: "Courier New", monospace;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { border-style: inset; }
        .lista { min-height: 250px; }

        /* --- JOGO --- */
        .jogo {
            padding: 12px;
            border: 1px solid #0f0;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .jogo:hover {
            background: #004400;
        }
        .nome { font-weight: bold; margin-bottom: 4px; font-size: 16px; }

        /* --- BOTÃO PLAY --- */
        .botao-play {
            margin-top: 10px;
            background: #002200;
            border: 2px outset #0f0;
            color: #0f0;
            padding: 10px 25px;
            font-family: "Courier New", monospace;
            cursor: pointer;
            display: inline-block;
        }
        .botao-play:active { border-style: inset; }

        /* --- TELA DE ERRO 404 --- */
        .tela-erro {
            text-align: center;
            padding: 30px 10px;
        }
        .robo { font-size: 80px; margin: 10px 0; }
        .codigo-erro {
            font-size: 48px; font-weight: bold; margin: 15px 0;
            animation: piscar 1s infinite;
        }
        .texto-erro { font-size: 16px; opacity: 0.8; margin-bottom: 20px; }
        .botao-voltar {
            background: #8F0101;
            border: 2px outset #0f0;
            color: #0f0;
            padding: 10px 25px;
            font-family: "Courier New", monospace;
            cursor: pointer;
        }
        .botao-voltar:active { border-style: inset; }

        .rodape {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            border-top: 1px solid #0f0;
            padding-top: 10px;
        }
        .piscando { animation: piscar 1s infinite; }
        @keyframes piscar {
            0%,100% { opacity:1; }
            50% { opacity:0; }
        }
    </style>
</head>
<body>

<div class="tela">
    <h1>=== PESQUISA DE JOGOS 1988 ===</h1>

    <div class="barra">
        <input type="text" id="busca" placeholder="Digite o nome do jogo...">
        <button onclick="buscar()">▶ BUSCAR</button>
    </div>

    <div class="lista" id="area">
        <div style="text-align:center; opacity:0.6; padding:20px;">
            Digite o nome ou veja todos os jogos abaixo 👇
        </div>
    </div>

    <div class="rodape">
        <span>4 JOGOS CADASTRADOS</span>
        <span>Richard 💙</span>
        <span class="piscando">_</span>
    </div>
</div>

<script>
const jogos = [
    { nome: 'JOGO 1', tipo: 'Ação / Aventura' },
    { nome: 'JOGO 2', tipo: 'Tiro / Espaço' },
    { nome: 'JOGO 3', tipo: 'Corrida' },
    { nome: 'JOGO 4', tipo: 'RPG / Fantasia' }
];

// Mostra todos ao abrir
mostrarTodos();

function buscar() {
    const texto = document.getElementById('busca').value.trim().toUpperCase();
    const area = document.getElementById('area');

    if (!texto) {
        mostrarTodos();
        return;
    }

    const encontrados = jogos.filter(j => j.nome.toUpperCase().includes(texto));

    if (encontrados.length === 0) {
        area.innerHTML = `
            <div class="tela-erro">
                <div class="robo">🤖</div>
                <div class="codigo-erro">ERRO 404</div>
                <div class="texto-erro">
                    Algo deu errado no sistema.<br>
                    O jogo "<strong>${texto}</strong>" não foi encontrado.
                </div>
                <button class="botao-voltar" onclick="limpar()">🔙 VOLTAR</button>
            </div>
        `;
        return;
    }

    area.innerHTML = encontrados.map(j => `
        <div class="jogo" onclick="mostrarPlay('${j.nome}')">
            <div class="nome">🎮 ${j.nome}</div>
            <div>${j.tipo}</div>
            <div id="play-${j.nome.replace(/\s+/g, '-')}" style="display:none;">
                <button class="botao-play">▶ PLAY</button>
            </div>
        </div>
    `).join('');
}

function mostrarTodos() {
    document.getElementById('area').innerHTML = jogos.map(j => `
        <div class="jogo" onclick="mostrarPlay('${j.nome}')">
            <div class="nome">🎮 ${j.nome}</div>
            <div>${j.tipo}</div>
            <div id="play-${j.nome.replace(/\s+/g, '-')}" style="display:none;">
                <button class="botao-play">▶ PLAY</button>
            </div>
        </div>
    `).join('');
}

function mostrarPlay(nomeJogo) {
    const idPlay = `play-${nomeJogo.replace(/\s+/g, '-')}`;
    const elementoPlay = document.getElementById(idPlay);

    if (elementoPlay) {
        elementoPlay.style.display = elementoPlay.style.display === 'none' ? 'block' : 'none';
    }
}

function limpar() {
    document.getElementById('busca').value = '';
    mostrarTodos();
}

document.getElementById('busca').addEventListener('keypress', e => {
    if (e.key === 'Enter') buscar();
});
</script>

</body>
</html>

<h1>>nova versão 2027 ©</h1>
